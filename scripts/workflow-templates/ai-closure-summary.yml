name: AI Closure Summary

# When an issue closes as "completed", finds the merging PR, reads its diff,
# and posts a structured closure comment on the issue (root cause + fix).
# Optional Stage 5 of the AI workflow — see:
#   https://github.com/Jigen-lab/playbook/blob/main/workflows/ai-assisted-development.md
#
# Requires the org-level secret CLAUDE_OAUTH_TOKEN to be granted to this repo.
# If it is not, the action step will fail silently and the closure comment
# is just skipped — there is no harm to the merge itself.

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  summarize:
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Find merging PR
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          PR=$(gh pr list \
            --search "closed:>${ISSUE_NUM} closes:${ISSUE_NUM}" \
            --state merged --json number --jq '.[0].number // ""')
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"

      - name: Generate closure summary
        if: steps.find_pr.outputs.pr != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude-token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          mode: comment-issue
          issue-number: ${{ github.event.issue.number }}
          allowed-tools: "Bash(git:*),Bash(gh:pr*),Read,Glob,Grep"
          max-turns: 5
          prompt: |
            Issue #${{ github.event.issue.number }} ("${{ github.event.issue.title }}") was just closed.
            The merging PR is #${{ steps.find_pr.outputs.pr }}.

            Tasks:
            1. Read the PR diff: gh pr diff ${{ steps.find_pr.outputs.pr }}
            2. Identify root cause and fix from the diff
            3. Post a structured closure comment in this exact format:

               Closing this as fixed in #${{ steps.find_pr.outputs.pr }}.

               **Root cause**: <one paragraph>

               **Fix**: <one paragraph, what changed and why>

               **Files touched**: <bulleted list of file:line ranges>

               ---
               *Generated by Claude Code Action.*
