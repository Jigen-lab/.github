version: 2
# Multi-language repo template — uncomment the ecosystems actually used.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["area: dependencies", "area: ci"]

