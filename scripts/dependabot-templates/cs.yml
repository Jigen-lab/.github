version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["area: dependencies", "area: ci"]

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["area: dependencies"]
