# Default Dependabot config — copy into individual repos as needed.
# Note: This file in the .github repo is NOT auto-applied to other repos
# (Dependabot config is per-repo). Use this as a starting template.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

